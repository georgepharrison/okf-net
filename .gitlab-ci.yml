# .gitlab-ci.yml
# okf-net pipeline for gitlab.tychostation.dev

stages:
  - validate
  - release

variables:
  # commit-check walks push history; a shallow clone is not enough.
  GIT_DEPTH: 0

# Never create merge-request pipelines — branch pipelines (on push) and tag
# pipelines (on release tags) only. Neither medina nor iac defines an
# explicit top-level `workflow:` block; both get "branch/tag only" behavior
# implicitly, because every job's own `rules:` matches `$CI_COMMIT_BRANCH`
# or `$CI_COMMIT_TAG` and none matches `merge_request_event`. This block
# makes that intent explicit at the pipeline level (GitLab's own recommended
# pattern for suppressing MR pipelines) rather than relying solely on every
# job happening to omit an MR rule.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# No custom okf-net image exists yet. Following medina's convention (a
# shared generic base image + before_script provisioning, rather than iac's
# per-job bespoke images), mise is installed here via the official installer
# on a node:22-slim base — node/npm is needed anyway for markdownlint-cli2
# (mise's npm backend) and for semantic-release in the release job below.
# TODO: once a custom okf-net CI image exists, bake mise into it and drop
# this before_script.
default:
  image: node:22-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates
    - curl https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install

lint:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - mise run lint

# .NET jobs. These deliberately bypass the default image and before_script:
# dotnet is the only tool they need and the SDK image already ships it, so
# installing mise (whose sole job here is to provision that same SDK, plus
# node for markdownlint) would add a minute of setup for nothing. Keep the
# image tag in step with mise.toml's `dotnet = "10"`.
.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  before_script: []
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    # Keep the package cache inside the workspace so GitLab can cache it.
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  cache:
    # GitLab allows at most 2 files in cache:key:files; key on the two src
    # csprojs (test projects reference the same packages, so churn there
    # rarely warrants a fresh cache).
    key:
      files:
        - src/Okf.Core/Okf.Core.csproj
        - src/Okf.Cli/Okf.Cli.csproj
    paths:
      - .nuget/packages
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  extends: .dotnet
  stage: validate
  script:
    - dotnet build Okf.sln --configuration Release

test:
  extends: .dotnet
  stage: validate
  variables:
    # ACC-1/ACC-6: the acceptance test lints Google's reference bundles; give
    # the runner a shallow clone so the test runs instead of skipping.
    OKF_REFERENCE_BUNDLES: "$CI_PROJECT_DIR/.reference/knowledge-catalog/okf/bundles"
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - git clone --depth 1 https://github.com/GoogleCloudPlatform/knowledge-catalog.git .reference/knowledge-catalog
    - dotnet test Okf.sln --configuration Release

# The dogfood gate (PRD ACC-5, ACC-6). Runs the CLI built from THIS pipeline's
# source against this repo's own bundle, so a regression in Okf.Core breaks
# okf-net's own build rather than being discovered by a consumer. `dotnet run`
# rather than a published binary deliberately: it is the same source the build
# and test jobs compile, with no artifact hand-off to go stale between stages.
#
# Two commands, two contracts:
#   - `lint okf/` picks up okf/okf.json, which promotes OKF0306 and OKF0301 to
#     error for this vault, so exit 1 covers drift and missing descriptions as
#     well as §11 conformance (CLI-14).
#   - `index --check` is the mechanical drift gate; its exit code is fixed at 1
#     on drift and deliberately does NOT consult severity, so it still fails
#     even if someone demotes OKF0306 in config.
# No network access is needed by either (CLI-16).
dogfood:
  extends: .dotnet
  stage: validate
  script:
    - dotnet run --project src/Okf.Cli -- lint okf/
    - dotnet run --project src/Okf.Cli -- index --check okf/bundles/okf-net

# Enforces AGENTS.md's "dependencies must be Apache-2.0-compatible" rule, which
# GitLab CE cannot enforce for us (SBOM license scanning and license approval
# policies are Ultimate features). Same three steps as `mise run licenses`.
#
# The SDK image installs only curl, git, libatomic1 and wget on top of
# buildpack-deps:<suite>-curl, so it has no python3 — hence the apt-get. The
# checker is stdlib-only, so python3 alone suffices: no pip, no venv.
licenses:
  extends: .dotnet
  stage: validate
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
    - dotnet tool restore
    - dotnet CycloneDX Okf.sln --output artifacts/sbom --filename bom.json --output-format Json
    - python3 scripts/check-licenses.py
  artifacts:
    # Publish the SBOM even when the check fails — the rejected SBOM is exactly
    # the one worth reading, and CE has no license-scanning UI to fall back on.
    when: always
    expire_in: 30 days
    paths:
      - artifacts/sbom/bom.json

commit-check:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    # Validate every non-merge commit in the push, mirroring medina's
    # range-based conventional-commits job. Falls back to checking just the
    # head commit when no push range is available (new branch / first
    # pipeline) — the fallback the task allowed as acceptable on its own.
    - |
      if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
        commits="$(git log --no-merges --format=%H "$RANGE")"
      else
        echo "no push range available (new branch or first pipeline) — checking HEAD only"
        commits="$CI_COMMIT_SHA"
      fi
      failed=0
      for sha in $commits; do
        echo "Checking ${sha}: $(git log -1 --format=%s "$sha")"
        mise run check-commit -- -m "$(git log -1 --format=%B "$sha")" || failed=1
      done
      exit $failed

# Semantic release, on the default branch only. Invocation style and image
# copied from iac's semantic-release job (node:22-slim, global npm install
# of the plugins, git fetch --tags before running); the trigger rule differs
# from iac deliberately — iac releases on tag push, okf-net releases by
# having semantic-release itself cut the (prerelease) tag from main.
release:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
    - git fetch --tags --force
    - npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/gitlab conventional-changelog-conventionalcommits
  script:
    - semantic-release

# GitLab's built-in secret detection ships with self-managed GitLab and can
# be enabled later.
# include:
#   - template: Security/Secret-Detection.gitlab-ci.yml
