# .gitlab-ci.yml
# okf-net pipeline for gitlab.tychostation.dev

stages:
  - validate
  - deploy
  - release

variables:
  # commit-check walks push history; a shallow clone is not enough.
  GIT_DEPTH: 0

# Never create merge-request pipelines — branch pipelines (on push) and tag
# pipelines (on release tags) only. Neither medina nor iac defines an
# explicit top-level `workflow:` block; both get "branch/tag only" behavior
# implicitly, because every job's own `rules:` matches `$CI_COMMIT_BRANCH`
# or `$CI_COMMIT_TAG` and none matches `merge_request_event`. This block
# makes that intent explicit at the pipeline level (GitLab's own recommended
# pattern for suppressing MR pipelines) rather than relying solely on every
# job happening to omit an MR rule.
#
# `schedule` is named for the `mutation` job below. A scheduled pipeline also
# sets $CI_COMMIT_BRANCH, so the branch rule already admits it; spelling it out
# keeps the pipeline's legitimate entry points readable, and because the
# never-rule stays first, adding one cannot turn MR pipelines back on.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# No custom okf-net image exists yet. Following medina's convention (a
# shared generic base image + before_script provisioning, rather than iac's
# per-job bespoke images), mise is installed here via the official installer
# on a node:22-slim base — node/npm is needed anyway for markdownlint-cli2
# (mise's npm backend) and for semantic-release in the release job below.
# TODO: once a custom okf-net CI image exists, bake mise into it and drop
# this before_script.
default:
  image: node:22-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates
    - curl https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install

lint:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - mise run lint

# The installer's acceptance suite (work item #25). install.sh is the one thing in this
# repo a stranger runs before anything else exists on their machine, and the one thing the
# .NET suite cannot reach: it is POSIX sh, it talks HTTP, and its failure mode is a
# half-installed binary. tests/install-sh/run.sh serves a fake artifact host with
# `python3 -m http.server` and runs the real installer against it as a subprocess.
#
# Neither of this pipeline's two existing images fits. The default (node:22-slim + mise)
# would provision the whole dotnet 10 SDK in order to run a shell script, and the `.dotnet`
# image ships no python3 (see the `licenses` job's note). So: a plain python image, no mise,
# no .NET, `before_script: []` — the cheapest job in the pipeline by a wide margin.
#
# python:3.12-slim is Debian, which matters twice over. It carries no curl, hence the one
# apt-get; and its /bin/sh is dash, with `dash` itself on PATH, so the harness's second
# shell lane actually runs here instead of skipping. That lane is the point of running this
# in CI at all: a bashism the developer's bash forgave is exactly what reaches a user's
# Debian box. The `command -v dash` line makes the lane's absence loud rather than silent —
# a skipped shell would otherwise look identical to a passing one.
test-install:
  stage: validate
  image: python:3.12-slim
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
    - command -v dash >/dev/null || { echo "dash is missing — the POSIX lane would silently skip" >&2; exit 1; }
    - tests/install-sh/run.sh

# .NET jobs. These deliberately bypass the default image and before_script:
# dotnet is the only tool they need and the SDK image already ships it, so
# installing mise (whose sole job here is to provision that same SDK, plus
# node for markdownlint) would add a minute of setup for nothing. Keep the
# image tag in step with mise.toml's `dotnet = "10"`.
.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  before_script: []
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    # Keep the package cache inside the workspace so GitLab can cache it.
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  cache:
    # GitLab allows at most 2 files in cache:key:files; key on the two src
    # csprojs (test projects reference the same packages, so churn there
    # rarely warrants a fresh cache).
    key:
      files:
        - src/Okf.Core/Okf.Core.csproj
        - src/Okf.Cli/Okf.Cli.csproj
    paths:
      - .nuget/packages
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  extends: .dotnet
  stage: validate
  script:
    - dotnet build Okf.sln --configuration Release

test:
  extends: .dotnet
  stage: validate
  variables:
    # ACC-1/ACC-6: the acceptance test lints Google's reference bundles; give
    # the runner a shallow clone so the test runs instead of skipping.
    OKF_REFERENCE_BUNDLES: "$CI_PROJECT_DIR/.reference/knowledge-catalog/okf/bundles"
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - git clone --depth 1 https://github.com/GoogleCloudPlatform/knowledge-catalog.git .reference/knowledge-catalog
    - dotnet test Okf.sln --configuration Release

# The dogfood gate (PRD ACC-5, ACC-6). Runs the CLI built from THIS pipeline's
# source against this repo's own bundle, so a regression in Okf.Core breaks
# okf-net's own build rather than being discovered by a consumer. `dotnet run`
# rather than a published binary deliberately: it is the same source the build
# and test jobs compile, with no artifact hand-off to go stale between stages.
#
# Three commands, three contracts:
#   - `lint okf/` picks up okf/okf.json, which promotes OKF0306, OKF0301,
#     OKF0307 and OKF0310 to error for this vault, so exit 1 covers drift,
#     missing descriptions, unfollowable provenance and a mutated raw/ item as
#     well as §11 conformance (CLI-14).
#   - `index --check` is the mechanical drift gate; its exit code is fixed at 1
#     on drift and deliberately does NOT consult severity, so it still fails
#     even if someone demotes OKF0306 in config.
#   - `okf/custodian/check-manifest.py` covers what the linter still does not.
#     The two overlap on exactly one finding: OKF0310 re-hashes every ingested
#     raw/ item against its recorded sha256, which is the linter's one
#     vault-scoped rule — `raw/` sits outside every bundle root, so a rule about
#     it cannot be scoped like the others (CLI-9, shipped with work item #4).
#     Everything else about the record is the script's alone: the id grammar,
#     the timestamp forms, the flat/packet layout, files in raw/ no entry
#     claims, ingestion pointers resolving to concepts that exist, and a
#     manifest that will not parse at all — which the rule is deliberately
#     silent about, because a check that cannot read the record cannot claim the
#     artifact changed. Same exit-code convention as `okf lint`, and it writes
#     nothing: a script that repairs the immutability record is how the record
#     is lost.
# No network access is needed by any of the three (CLI-16).
#
# The SDK image ships no python3 (see the `licenses` job's note) and the checker
# is stdlib-only, so the one apt-get below is the whole dependency story — no
# pip, no venv. Python rather than bash because decisions §3 puts custodian
# scripts in the one interpreter arbitrary consumer and CI environments
# reliably already have.
dogfood:
  extends: .dotnet
  stage: validate
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
    - dotnet run --project src/Okf.Cli -- lint okf/
    - dotnet run --project src/Okf.Cli -- index --check okf/bundles/okf-net
    - python3 okf/custodian/check-manifest.py

# Enforces AGENTS.md's "dependencies must be Apache-2.0-compatible" rule, which
# GitLab CE cannot enforce for us (SBOM license scanning and license approval
# policies are Ultimate features). Same three steps as `mise run licenses`.
#
# The SDK image installs only curl, git, libatomic1 and wget on top of
# buildpack-deps:<suite>-curl, so it has no python3 — hence the apt-get. The
# checker is stdlib-only, so python3 alone suffices: no pip, no venv.
licenses:
  extends: .dotnet
  stage: validate
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
    - dotnet tool restore
    - dotnet CycloneDX Okf.sln --output artifacts/sbom --filename bom.json --output-format Json
    - python3 scripts/check-licenses.py
  artifacts:
    # Publish the SBOM even when the check fails — the rejected SBOM is exactly
    # the one worth reading, and CE has no license-scanning UI to fall back on.
    when: always
    expire_in: 30 days
    paths:
      - artifacts/sbom/bom.json

# Mutation testing (Stryker.NET), the mechanical form of AGENTS.md's "tests must be
# shown to constrain the code": every surviving mutant is a change to the source that
# no test noticed. Deliberately NOT a per-push gate — a full solution run is ~3400
# mutants and ~8 minutes of saturated CPU locally, which is not a price worth paying on
# every commit for a signal that moves slowly.
#
# Two ways in, and no third:
#   - a scheduled pipeline, where it is the point of the run and blocks on
#     `thresholds.break` (60) from stryker-config.json;
#   - `when: manual` on a branch push, so it can be reached for while working on tests
#     without ever blocking a push. `allow_failure: true` there because a manual job
#     defaults to blocking the stage, and a mutation score is a report, not a gate.
# There is no rule for tags: a release should not wait on this.
mutation:
  extends: .dotnet
  stage: validate
  # ~8 minutes locally on 8 cores; a shared runner is slower and the default job
  # timeout (1h) is uncomfortably close.
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - dotnet tool restore
    - dotnet stryker --output artifacts/stryker --skip-version-check
    # The markdown summary is a per-file table; putting it in the job log means the
    # score is readable without downloading the artifact.
    - cat artifacts/stryker/reports/mutation-report.md
  artifacts:
    # Published even when the score breaks the threshold: the run that failed is the
    # one whose survivors are worth reading.
    when: always
    expire_in: 30 days
    paths:
      - artifacts/stryker/reports/

commit-check:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    # Validate every non-merge commit in the push, mirroring medina's
    # range-based conventional-commits job. Falls back to checking just the
    # head commit when no push range is available (new branch / first
    # pipeline) — the fallback the task allowed as acceptable on its own.
    - |
      if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
        commits="$(git log --no-merges --format=%H "$RANGE")"
      else
        echo "no push range available (new branch or first pipeline) — checking HEAD only"
        commits="$CI_COMMIT_SHA"
      fi
      failed=0
      for sha in $commits; do
        echo "Checking ${sha}: $(git log -1 --format=%s "$sha")"
        mise run check-commit -- -m "$(git log -1 --format=%B "$sha")" || failed=1
      done
      exit $failed

# Semantic release, on the two release branches. Invocation style and image
# copied from iac's semantic-release job (node:22-slim, global npm install
# of the plugins, git fetch --tags before running); the trigger rule differs
# from iac deliberately — iac releases on tag push, okf-net releases by
# having semantic-release itself cut the tag from the branch it ran on.
#
# Two branches since the 1.0.0 flip (work item #10), matching `.releaserc.yml`:
# `dev` is the `rc` prerelease channel and cuts `vX.Y.Z-rc.N`, `main` is the
# release branch and cuts `vX.Y.Z`. Both are spelled out by name rather than
# via `$CI_DEFAULT_BRANCH` — the default branch is one of the two, and naming
# only it would silently mean "main only" again. semantic-release itself
# decides which channel a run is on, from the branch name; this rule only
# decides whether it is invoked at all. Every other branch reaches no release
# job, so a feature branch cannot tag anything.
release:
  stage: release
  rules:
    # A scheduled pipeline runs on a branch, so without this it would reach the release
    # job on main. Schedules exist here to run `mutation`; cutting a release is a
    # consequence of a push, never of a clock.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
    - git fetch --tags --force
    # Pinned exactly, and the pin is load-bearing (work item #52). These are
    # five independently versioned packages that npm resolves fresh on every
    # run, and semantic-release only declares four of them: the preset named
    # in .releaserc.yml is looked up by name at runtime, so npm is free to
    # install a major that the resolved release-notes-generator cannot drive.
    # That is what happened. release-notes-generator 14.x renders through
    # conventional-changelog-writer ^8 (Handlebars template STRINGS), while
    # conventional-changelog-conventionalcommits 10.x emits the writer-9
    # shape instead — template FUNCTIONS, under a `template` key where
    # writer 8 reads `mainTemplate`. The mismatch is silent, not fatal:
    # Handlebars accepts a function as a partial, so the preset's
    # headerPartial still rendered the `## version (date)` line, while every
    # commit section rendered empty. Every release this project had cut —
    # all 34, v1.0.0-rc.1 to v1.0.0-rc.34 — shipped a header and nothing
    # else. Bump these together, and only after `semantic-release --dry-run`
    # shows sectioned notes.
    - npm install -g semantic-release@25.0.9 @semantic-release/commit-analyzer@13.0.1 @semantic-release/release-notes-generator@14.1.1 @semantic-release/gitlab@13.3.3 conventional-changelog-conventionalcommits@9.3.1
  script:
    - semantic-release

# GitLab's built-in secret detection ships with self-managed GitLab and can
# be enabled later.
# include:
#   - template: Security/Secret-Detection.gitlab-ci.yml

# ============================================================================
# Tag pipelines (issue #10). Everything below runs only for `$CI_COMMIT_TAG`.
#
# The `workflow:` block above has always allowed tag pipelines, but until now
# no job matched a tag: every tag semantic-release cut started a pipeline that
# failed immediately with "no jobs in this pipeline", so a red pipeline was the
# normal outcome of a successful release. `publish` is the job that makes a tag
# pipeline mean something.
#
# It deliberately does NOT reuse the `publish-aot` mise task: that task derives
# a version from `git describe` against the working tree, and here the version
# is the thing being released — the tag itself, which is authoritative and needs
# no guessing. Both callers agree on the contract Directory.Build.props
# documents (a bare semver in `-p:Version`, a commit in `-p:SourceRevisionId`).
#
# Every step echoes what it is about to do, including the URLs it will call.
# None of this can be exercised before a real tag exists, so the log has to be
# the debugger.
# ============================================================================
publish:
  # Inherits the SDK image, the NuGet cache and the telemetry opt-outs; `rules`
  # is replaced wholesale (extends merges keys, it does not append to lists),
  # which is the point — `.dotnet` is branch-only, this job is tag-only.
  extends: .dotnet
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # Same package coordinates the README's install one-liner documents. The
    # file name carries the platform because the package version cannot: one
    # generic package version holds many files, and each RID is another file
    # under this same version. That shape is why issue #36 needed no schema
    # change here — only more entries.
    OKF_PACKAGE_NAME: okf
    OKF_LINUX_FILE: okf-linux-x64
    OKF_OSX_FILE: okf-osx-arm64
    OKF_WIN_FILE: okf-win-x64.exe
    # The knowledge asset (issue #5): this repository's own knowledge bundle,
    # packaged by the binary this job just built. Same package version, another
    # file under it — which is exactly what the generic registry's one-version-
    # many-files shape is for.
    OKF_KNOWLEDGE_FILE: okf-net-knowledge.tar.gz
    # The agent skills (issue #41). Every binary already carries them, so this
    # asset is not how they reach a user of the installer; it is how they reach
    # anyone who wants the prose without the binary — another agent host, a
    # vendored copy under a project's own skills/, a reviewer reading a release.
    OKF_SKILLS_FILE: okf-skills.tar.gz
    # The self-describing pair (issue #25): a manifest naming every asset with
    # its sha256, and the installers that read it. Uploading them from the repo —
    # rather than letting the artifact host serve whatever is on main — means the
    # installer a release hands you is the one that release was cut with. Two
    # installers since #36: install.sh for Linux and macOS, install.ps1 for
    # Windows.
    OKF_MANIFEST_FILE: latest.json
    OKF_INSTALLER_FILE: install.sh
    OKF_INSTALLER_PS_FILE: install.ps1
  script:
    - |
      # The tag is `vX.Y.Z` from `main` or `vX.Y.Z-rc.N` from `dev`, and this job
      # does not care which: the package version is that string without the `v`,
      # so that it is character-for-character what the binary inside it answers
      # to `okf version` (modulo the `+sha` metadata). Nothing below branches on
      # the `-rc.N`, which is what makes a candidate and a release the same build
      # verified the same way. The registry would take the `v` too — this
      # instance was probed with a deliberately non-semver version and accepted
      # it (2026-08-14), so the strip is a consistency choice, not a validation
      # workaround.
      OKF_VERSION="${CI_COMMIT_TAG#v}"
      OKF_PACKAGE_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${OKF_PACKAGE_NAME}/${OKF_VERSION}"
      OKF_LINUX_URL="${OKF_PACKAGE_BASE}/${OKF_LINUX_FILE}"
      OKF_OSX_URL="${OKF_PACKAGE_BASE}/${OKF_OSX_FILE}"
      OKF_WIN_URL="${OKF_PACKAGE_BASE}/${OKF_WIN_FILE}"
      OKF_KNOWLEDGE_URL="${OKF_PACKAGE_BASE}/${OKF_KNOWLEDGE_FILE}"
      OKF_SKILLS_URL="${OKF_PACKAGE_BASE}/${OKF_SKILLS_FILE}"
      OKF_MANIFEST_URL="${OKF_PACKAGE_BASE}/${OKF_MANIFEST_FILE}"
      OKF_INSTALLER_URL="${OKF_PACKAGE_BASE}/${OKF_INSTALLER_FILE}"
      OKF_INSTALLER_PS_URL="${OKF_PACKAGE_BASE}/${OKF_INSTALLER_PS_FILE}"
      OKF_RELEASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}"
      # The job token authenticates both APIs. If the instance ever refuses it
      # for release asset links, set a project CI variable RELEASE_API_TOKEN
      # (masked, `api` scope) and this switches over with no other change.
      if [ -n "${RELEASE_API_TOKEN:-}" ]; then
        OKF_AUTH_HEADER="PRIVATE-TOKEN: ${RELEASE_API_TOKEN}"
        echo "==> authenticating with RELEASE_API_TOKEN"
      else
        OKF_AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
        echo "==> authenticating with the CI job token"
      fi
      echo "==> tag ${CI_COMMIT_TAG} -> version ${OKF_VERSION}, commit ${CI_COMMIT_SHORT_SHA}"
      echo "    linux-x64:   ${OKF_LINUX_URL}"
      echo "    osx-arm64:   ${OKF_OSX_URL}"
      echo "    win-x64:     ${OKF_WIN_URL}"
      echo "    knowledge:   ${OKF_KNOWLEDGE_URL}"
      echo "    skills:      ${OKF_SKILLS_URL}"
      echo "    manifest:    ${OKF_MANIFEST_URL}"
      echo "    install.sh:  ${OKF_INSTALLER_URL}"
      echo "    install.ps1: ${OKF_INSTALLER_PS_URL}"
      echo "    release:     ${OKF_RELEASE_URL}"

    - |
      # NativeAOT needs a C toolchain and zlib headers, which the SDK image does
      # not carry (it is buildpack-deps:*-curl plus the SDK). Documented
      # prerequisite: `apt-get install clang zlib1g-dev`.
      echo "==> installing the NativeAOT toolchain (clang, zlib1g-dev)"
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends clang zlib1g-dev >/dev/null

    - |
      echo "==> publishing NativeAOT linux-x64 stamped ${OKF_VERSION}+${CI_COMMIT_SHORT_SHA}"
      dotnet publish src/Okf.Cli \
        --configuration Release \
        --runtime linux-x64 \
        --output artifacts/aot \
        -p:Version="${OKF_VERSION}" \
        -p:SourceRevisionId="${CI_COMMIT_SHORT_SHA}"

    - |
      # Proves the stamp survived the native compile before anything is
      # published under a version number that claims it. Printing it is not the
      # proof: a binary that lost the stamp answers `0.0.0-dev`, which prints
      # into a green log and gets uploaded as `okf/<tag>/` regardless. The
      # reported version is compared against the one the package will claim,
      # and a mismatch fails the job before anything leaves it.
      okf_reported="$(./artifacts/aot/okf version)"
      okf_expected="${OKF_VERSION}+${CI_COMMIT_SHORT_SHA}"
      echo "==> the published binary reports: ${okf_reported}"
      if [ "${okf_reported}" != "${okf_expected}" ]; then
        echo "    expected ${okf_expected} — refusing to publish a mis-stamped binary" >&2
        exit 1
      fi

    - |
      # The macOS and Windows binaries (issue #36). NOT NativeAOT, and that is a
      # decision rather than an oversight: NativeAOT compiles through the HOST's
      # native toolchain, so `-r osx-arm64 -p:PublishAot=true` cannot run here and
      # there is no Mac or Windows runner attached to this instance. decisions.md
      # Q10 wrote the fallback down for exactly this case — trim-safe
      # self-contained non-AOT, paying size and cold start — and this exercises it.
      #
      # `-p:PublishAot=false` is required, not tidy: Okf.Cli.csproj turns PublishAot
      # on so the analyzers run on every build, and left on it would try to invoke
      # ILC for a foreign OS. The trim analyzer still runs under PublishTrimmed, and
      # TreatWarningsAsErrors is on, so an IL2xxx warning fails this job rather than
      # shipping quietly. Both RIDs publish clean today.
      #
      # Nothing here can be executed: this is a Linux runner. The self-version
      # assertion above covers linux-x64 only, and for these two the manifest
      # records size and sha256 of bytes this job produced and nothing more. `file`
      # is the whole static check, and it is worth the two lines — a publish that
      # silently produced an ELF for `-r win-x64` would otherwise reach a tester.
      echo "==> publishing trim-safe self-contained osx-arm64 and win-x64 stamped ${OKF_VERSION}+${CI_COMMIT_SHORT_SHA}"
      for rid in osx-arm64 win-x64; do
        dotnet publish src/Okf.Cli \
          --configuration Release \
          --runtime "${rid}" \
          --self-contained \
          -p:PublishAot=false \
          -p:PublishTrimmed=true \
          -p:PublishSingleFile=true \
          --output "artifacts/${rid}" \
          -p:Version="${OKF_VERSION}" \
          -p:SourceRevisionId="${CI_COMMIT_SHORT_SHA}"
      done

      for built in artifacts/osx-arm64/okf artifacts/win-x64/okf.exe; do
        [ -f "${built}" ] || {
          echo "    ${built} was not produced — refusing to publish" >&2; exit 1; }
      done

      apt-get install -y -qq --no-install-recommends file >/dev/null
      echo "==> what was built:"
      file artifacts/aot/okf artifacts/osx-arm64/okf artifacts/win-x64/okf.exe

      # Cheap and worth it: `file`'s own words, checked. The failure this catches is
      # a publish that produced the host's format for a foreign RID, which prints
      # into a green log and installs onto a tester's Mac as an ELF.
      file artifacts/osx-arm64/okf | grep -q 'Mach-O.*arm64' || {
        echo "    artifacts/osx-arm64/okf is not a Mach-O arm64 binary" >&2; exit 1; }
      file artifacts/win-x64/okf.exe | grep -q 'PE32+' || {
        echo "    artifacts/win-x64/okf.exe is not a PE32+ binary" >&2; exit 1; }

    - |
      echo "==> uploading the three binaries to the generic package registry"
      # Re-running a tag pipeline uploads the same file names under the same
      # package version again. Generic packages allow duplicates by default, so
      # a rerun is fine as written; if duplicates are ever disallowed on this
      # project, this is the step that will fail, and the fix is to skip the
      # upload when the file already exists — not to force it.
      for upload in "artifacts/aot/okf|${OKF_LINUX_URL}" \
                    "artifacts/osx-arm64/okf|${OKF_OSX_URL}" \
                    "artifacts/win-x64/okf.exe|${OKF_WIN_URL}"; do
        upload_file="${upload%%|*}"
        upload_url="${upload#*|}"
        echo "    ${upload_file} -> ${upload_url##*/}"
        curl --silent --show-error --fail-with-body \
          --header "${OKF_AUTH_HEADER}" \
          --upload-file "${upload_file}" \
          "${upload_url}"
        echo
      done

    - |
      # The knowledge asset (issue #5): okf-net's own knowledge bundle, packaged by
      # the binary that was just published — so the toolset's release carries the
      # toolset's knowledge as an installable OKF bundle, and the bundler is
      # exercised by every release rather than only by the test suite.
      #
      # `--generated-at` is the commit's timestamp, not the job's clock: it is the
      # only clock reading in the packaging path, so pinning it makes the archive
      # reproducible from the tag alone — rerun the tag pipeline and the bytes are
      # the same. `--lint` lints what shipped, with default severities and no
      # okf.json, and fails the job (exit 1) rather than publishing a distribution
      # that does not conform. `--verify` then re-hashes the archive against the
      # manifest inside it, which is the check a consumer will run.
      echo "==> packaging the knowledge bundle from okf/ (stamped ${CI_COMMIT_TIMESTAMP})"
      ./artifacts/aot/okf bundle okf/ \
        --out "artifacts/${OKF_KNOWLEDGE_FILE}" \
        --generated-at "${CI_COMMIT_TIMESTAMP}" \
        --lint
      ./artifacts/aot/okf bundle --verify "artifacts/${OKF_KNOWLEDGE_FILE}"

      echo "==> uploading ${OKF_KNOWLEDGE_FILE} to the generic package registry"
      curl --silent --show-error --fail-with-body \
        --header "${OKF_AUTH_HEADER}" \
        --upload-file "artifacts/${OKF_KNOWLEDGE_FILE}" \
        "${OKF_KNOWLEDGE_URL}"
      echo

    - |
      # The agent skills archive (issue #41). Deterministic by construction, the same
      # discipline the bundler follows: entries sorted by name, one fixed mtime, uid/gid
      # zeroed, fixed mode, and `gzip -n` so the compressed stream carries no timestamp
      # and no file name. Rerun the tag pipeline and the bytes are identical, which is
      # what makes the sha256 in the manifest a fact about the release rather than about
      # the day it was cut.
      #
      # Only skills/*/SKILL.md: skills/README.md is this repository's documentation ABOUT
      # the skills, and shipping it would put a file naming repo-relative paths into an
      # archive a consumer unpacks somewhere else.
      # `--sort=name` orders what tar READS FROM A DIRECTORY and leaves operands in the
      # order it was handed them, so the member order here is the shell's glob order,
      # which sorts by LC_COLLATE. Sorted explicitly under LC_ALL=C instead: byte order,
      # on any runner, whatever its locale.
      echo "==> packaging the agent skills"
      OKF_SKILL_FILES="$(printf '%s\n' skills/*/SKILL.md | LC_ALL=C sort)"
      echo "${OKF_SKILL_FILES}"
      # shellcheck disable=SC2086 -- one path per skill, none with whitespace in it
      tar --sort=name --mtime='1980-01-01 00:00:00Z' --owner=0 --group=0 \
          --numeric-owner --mode='u=rw,go=r' --format=gnu \
          -cf - ${OKF_SKILL_FILES} | gzip -n > "artifacts/${OKF_SKILLS_FILE}"
      tar -tzf "artifacts/${OKF_SKILLS_FILE}"

      echo "==> uploading ${OKF_SKILLS_FILE} to the generic package registry"
      curl --silent --show-error --fail-with-body \
        --header "${OKF_AUTH_HEADER}" \
        --upload-file "artifacts/${OKF_SKILLS_FILE}" \
        "${OKF_SKILLS_URL}"
      echo

    - |
      # The release manifest (issue #25). This is what makes a release self-describing
      # and what install.sh reads: a version, and per asset a location and a digest.
      #
      # The digests are computed HERE, from the exact files this job uploads — not from a
      # fresh build, and not from anything re-downloaded. That is the whole value of the
      # manifest: install.sh trusts it, and it can only be trusted if it describes bytes
      # this job saw.
      #
      # The installers are in the map too, and those are the entries that matter most.
      # They are the two files in a release a stranger pipes into `sh` or into `iex`, and
      # without a digest they are the files the artifact host republishes with nothing to
      # check them against — the host pulls them over TLS with a token and then has to take
      # them on faith. A digest here gives the host, and anyone re-hosting a release,
      # something to compare. It does not let an installer verify itself (by the time it
      # runs, it has already run) and it is not a signature; what it closes is the gap
      # between the bytes this job published and the bytes a mirror serves.
      #
      # Eight assets since issue #41, and the schema has never had to change to hold them:
      # `assets` was a map keyed by asset name from the day it was written, so three RIDs,
      # two archives and two installers are more entries, not a new shape. install.sh reads
      # exactly the one it selected; sync.sh reads the ones it is told to.
      #
      # Two locations per asset, because there are two kinds of consumer:
      #   path — relative to whatever base URL the installer was given. This is the one
      #          install.sh uses, and it is what lets the same manifest describe the
      #          release from the artifact host, from a laptop, or from wherever
      #          issue #26 lands, without a rewrite.
      #   url  — the canonical package-registry URL. Authenticated (the project is
      #          private), and the thing the artifact host's sync.sh pulls from.
      #
      # `generatedAt` is the commit's timestamp normalised to UTC `Z`, NOT the job's
      # clock — the same rule the bundler follows, and for the same reason: it is the
      # only clock reading in the path, so pinning it keeps a rerun of a tag pipeline
      # byte-identical. `date -u -d` is GNU date, which the Debian-based SDK image has.
      #
      # Written with printf and shell, deliberately: the SDK image has no python3 and no
      # jq, and adding an apt-get to emit four scalars would be a dependency for nothing.
      # The format that comes out is a contract with install.sh's sed-based reader — no
      # whitespace inside any value, no object nested inside an asset. tests/install-sh
      # holds a fixture written to match this block; change one and change the other.
      echo "==> writing ${OKF_MANIFEST_FILE}"
      OKF_GENERATED_AT="$(date -u -d "${CI_COMMIT_TIMESTAMP}" +%Y-%m-%dT%H:%M:%SZ)"
      OKF_LINUX_SHA="$(sha256sum artifacts/aot/okf | cut -d' ' -f1)"
      OKF_LINUX_SIZE="$(wc -c < artifacts/aot/okf | tr -d ' ')"
      OKF_OSX_SHA="$(sha256sum artifacts/osx-arm64/okf | cut -d' ' -f1)"
      OKF_OSX_SIZE="$(wc -c < artifacts/osx-arm64/okf | tr -d ' ')"
      OKF_WIN_SHA="$(sha256sum artifacts/win-x64/okf.exe | cut -d' ' -f1)"
      OKF_WIN_SIZE="$(wc -c < artifacts/win-x64/okf.exe | tr -d ' ')"
      OKF_KNOWLEDGE_SHA="$(sha256sum "artifacts/${OKF_KNOWLEDGE_FILE}" | cut -d' ' -f1)"
      OKF_KNOWLEDGE_SIZE="$(wc -c < "artifacts/${OKF_KNOWLEDGE_FILE}" | tr -d ' ')"
      OKF_SKILLS_SHA="$(sha256sum "artifacts/${OKF_SKILLS_FILE}" | cut -d' ' -f1)"
      OKF_SKILLS_SIZE="$(wc -c < "artifacts/${OKF_SKILLS_FILE}" | tr -d ' ')"
      OKF_INSTALLER_SHA="$(sha256sum "${OKF_INSTALLER_FILE}" | cut -d' ' -f1)"
      OKF_INSTALLER_SIZE="$(wc -c < "${OKF_INSTALLER_FILE}" | tr -d ' ')"
      OKF_INSTALLER_PS_SHA="$(sha256sum "${OKF_INSTALLER_PS_FILE}" | cut -d' ' -f1)"
      OKF_INSTALLER_PS_SIZE="$(wc -c < "${OKF_INSTALLER_PS_FILE}" | tr -d ' ')"

      cat > "artifacts/${OKF_MANIFEST_FILE}" <<JSON
      {
        "version": "${OKF_VERSION}",
        "tag": "${CI_COMMIT_TAG}",
        "generatedAt": "${OKF_GENERATED_AT}",
        "assets": {
          "${OKF_LINUX_FILE}": {
            "path": "v${OKF_VERSION}/${OKF_LINUX_FILE}",
            "size": ${OKF_LINUX_SIZE},
            "sha256": "${OKF_LINUX_SHA}",
            "url": "${OKF_LINUX_URL}"
          },
          "${OKF_OSX_FILE}": {
            "path": "v${OKF_VERSION}/${OKF_OSX_FILE}",
            "size": ${OKF_OSX_SIZE},
            "sha256": "${OKF_OSX_SHA}",
            "url": "${OKF_OSX_URL}"
          },
          "${OKF_WIN_FILE}": {
            "path": "v${OKF_VERSION}/${OKF_WIN_FILE}",
            "size": ${OKF_WIN_SIZE},
            "sha256": "${OKF_WIN_SHA}",
            "url": "${OKF_WIN_URL}"
          },
          "${OKF_KNOWLEDGE_FILE}": {
            "path": "v${OKF_VERSION}/${OKF_KNOWLEDGE_FILE}",
            "size": ${OKF_KNOWLEDGE_SIZE},
            "sha256": "${OKF_KNOWLEDGE_SHA}",
            "url": "${OKF_KNOWLEDGE_URL}"
          },
          "${OKF_SKILLS_FILE}": {
            "path": "v${OKF_VERSION}/${OKF_SKILLS_FILE}",
            "size": ${OKF_SKILLS_SIZE},
            "sha256": "${OKF_SKILLS_SHA}",
            "url": "${OKF_SKILLS_URL}"
          },
          "${OKF_INSTALLER_FILE}": {
            "path": "v${OKF_VERSION}/${OKF_INSTALLER_FILE}",
            "size": ${OKF_INSTALLER_SIZE},
            "sha256": "${OKF_INSTALLER_SHA}",
            "url": "${OKF_INSTALLER_URL}"
          },
          "${OKF_INSTALLER_PS_FILE}": {
            "path": "v${OKF_VERSION}/${OKF_INSTALLER_PS_FILE}",
            "size": ${OKF_INSTALLER_PS_SIZE},
            "sha256": "${OKF_INSTALLER_PS_SHA}",
            "url": "${OKF_INSTALLER_PS_URL}"
          }
        }
      }
      JSON
      cat "artifacts/${OKF_MANIFEST_FILE}"

      echo "==> uploading ${OKF_MANIFEST_FILE}, ${OKF_INSTALLER_FILE} and ${OKF_INSTALLER_PS_FILE}"
      # Same duplicate-tolerant upload as the assets above, and the same documented
      # failure mode if this project ever disallows duplicate generic package files.
      for upload in "artifacts/${OKF_MANIFEST_FILE}|${OKF_MANIFEST_URL}" \
                    "${OKF_INSTALLER_FILE}|${OKF_INSTALLER_URL}" \
                    "${OKF_INSTALLER_PS_FILE}|${OKF_INSTALLER_PS_URL}"; do
        upload_file="${upload%%|*}"
        upload_url="${upload#*|}"
        echo "    ${upload_file} -> ${upload_url##*/}"
        curl --silent --show-error --fail-with-body \
          --header "${OKF_AUTH_HEADER}" \
          --upload-file "${upload_file}" \
          "${upload_url}"
        echo
      done

    - |
      # semantic-release creates the GitLab release from the main-branch
      # pipeline that pushed this tag, so the two pipelines overlap: the
      # release usually exists well before the AOT compile finishes, but it is
      # not guaranteed to exist when this job starts. Wait for it rather than
      # racing it.
      echo "==> waiting for release ${CI_COMMIT_TAG}"
      attempt=1
      until curl --silent --show-error --fail-with-body --output release.json \
            --header "${OKF_AUTH_HEADER}" "${OKF_RELEASE_URL}"; do
        if [ "${attempt}" -ge 10 ]; then
          # The loop retries every failure, not only a 404, so the reason it
          # gave up is not knowable from the fact that it did. `--fail-with-body`
          # left the last response in release.json; print it, because a 404
          # accuses semantic-release and a 401/403 accuses this job's own
          # credentials, and those are opposite repairs.
          echo "    release ${CI_COMMIT_TAG} still unreadable after ${attempt} attempts; last response:" >&2
          cat release.json >&2 || true
          echo >&2
          echo "    404 means semantic-release did not create it; anything else is this job's token." >&2
          exit 1
        fi
        echo "    not there yet (attempt ${attempt}); retrying in 15s"
        attempt=$((attempt + 1))
        sleep 15
      done

    - |
      # Idempotent by construction: link names and URLs must be unique within a
      # release, so a blind POST would fail the second time a tag pipeline runs
      # (a rerun, or a retried job). Ask first — once per asset.
      for asset in "${OKF_LINUX_FILE}|${OKF_LINUX_URL}" \
                   "${OKF_OSX_FILE}|${OKF_OSX_URL}" \
                   "${OKF_WIN_FILE}|${OKF_WIN_URL}" \
                   "${OKF_KNOWLEDGE_FILE}|${OKF_KNOWLEDGE_URL}" \
                   "${OKF_SKILLS_FILE}|${OKF_SKILLS_URL}" \
                   "${OKF_MANIFEST_FILE}|${OKF_MANIFEST_URL}" \
                   "${OKF_INSTALLER_FILE}|${OKF_INSTALLER_URL}" \
                   "${OKF_INSTALLER_PS_FILE}|${OKF_INSTALLER_PS_URL}"; do
        asset_name="${asset%%|*}"
        asset_url="${asset#*|}"
        if grep -qF "${asset_url}" release.json; then
          echo "==> ${asset_name} already linked on ${CI_COMMIT_TAG} — nothing to do"
        else
          echo "==> attaching ${asset_name} to release ${CI_COMMIT_TAG}"
          curl --silent --show-error --fail-with-body --request POST \
            --header "${OKF_AUTH_HEADER}" \
            --data-urlencode "name=${asset_name}" \
            --data-urlencode "url=${asset_url}" \
            --data-urlencode "link_type=package" \
            "${OKF_RELEASE_URL}/assets/links"
          echo
        fi
      done
  artifacts:
    # Every asset is already in the package registry; these copies exist so a
    # failed link step can be diagnosed (and the artifacts retrieved) from the
    # job itself. `when: always` is what makes that true — the default, on_success,
    # would throw the copy away in precisely the case it was kept for. Same
    # reasoning, same setting, as the `licenses` job's SBOM.
    #
    # The two cross-compiled binaries earn their place here twice over: they are
    # the only two this pipeline cannot execute, so a job artifact is how a tester
    # gets one out of a pipeline that failed after building it.
    when: always
    expire_in: 30 days
    paths:
      - artifacts/aot/okf
      - artifacts/osx-arm64/okf
      - artifacts/win-x64/okf.exe
      - artifacts/okf-net-knowledge.tar.gz
      - artifacts/okf-skills.tar.gz
      - artifacts/latest.json

# ============================================================================
# The custodian's scheduled inbox (issue #7). `okf inbox` derives, per concept,
# whether anything is waiting on a person: unacknowledged content, an expired
# `stale_after`, or a cited source that moved after the concept was written.
#
# It SURFACES and never gates. `--fail-if-any` exists and is deliberately not
# used here: PRD §1.3 makes automated content refresh a non-goal, the custodian
# drafts and a human lands, and an inbox that turns a pipeline red is an inbox
# people learn to route around. The job therefore publishes the JSON as an
# artifact and exits 0 whatever it finds — including on a vault where every
# concept is unverified, which is this one's honest state.
#
# Schedule-only, like `mutation`: the inbox answers a question about elapsed
# time, so running it on every push would re-report the same rows all day and
# find something new roughly never. The `workflow:` block at the top already
# admits scheduled pipelines. Add it to an existing schedule or give it its own;
# with no schedule configured the job simply never runs, which is a visible
# absence rather than a silent one.
#
# Both formats, on purpose: the text report is what a person reads in the job
# log without downloading anything, and the JSON is the machine interface the
# okf-custodian skill's refresh procedure starts from (`okf inbox --format
# json`). There is no reporting script here and there should not be — the CLI
# is the machine interface, and the skill is the procedure.
custodian-inbox:
  extends: .dotnet
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - dotnet run --project src/Okf.Cli -- inbox okf/
    - mkdir -p artifacts/custodian
    - dotnet run --project src/Okf.Cli -- inbox okf/ --format json > artifacts/custodian/inbox.json
  artifacts:
    # Kept whatever the scan found: an empty array is as much a result as a full
    # one, and the run that reported it is the one worth having.
    when: always
    expire_in: 30 days
    paths:
      - artifacts/custodian/inbox.json

# ---------------------------------------------------------------------------
# GitLab Pages for the generated knowledge site (issue #6).
#
# `okf site` renders the dogfood vault as a self-contained static site: a landing
# page carrying the bundle's index hierarchy, a trust dashboard whose tiles and
# tags are filters, a force-directed graph, one page per concept. Nothing about
# it needs a server — every link is relative and no page makes a network request
# — so the same directory is hostable here and openable from a `file://` path.
#
# `pages` is a reserved job name: a job called `pages` is a Pages deployment job
# with no further declaration, and the directory it publishes is `public` from
# its own artifacts. `--name` sets the site's title; without it the vault's
# directory name ("okf") is used, which is not what a reader wants to see.
#
# ONE deployment, on the default branch only. Merging is the deploy; nothing else
# writes there. This replaces the temporary branch-scoped rule that published the
# 6-static-site branch to the root while the design was being reviewed. It stayed
# main-only through the 1.0.0 flip while `release` gained `dev`: there is one site
# and one URL, and it should show what is released, not what is queued behind it.
#
# Branch review environments were built and tried on this instance, and refused
# (2026-08-15, pipeline 331). `pages.path_prefix` — GitLab's parallel-deployments
# feature — is a Premium/Ultimate keyword, and this is GitLab CE 19.0.1
# (`/version` reports `"enterprise": false`). It does not fail the job: the
# keyword is accepted by the linter, accepted by the pipeline, and then silently
# ignored, so `$CI_PAGES_URL` came back as the bare domain, the prefixed path
# 404s, and the feature branch published straight over the site root. A silent
# no-op that overwrites production is worse than no feature, so the review jobs
# were removed rather than left in place hoping.
#
# The accepted fallback (Ringo, 2026-08-15): reviewers run `mise run site` and
# open `artifacts/site/index.html` locally. Reinstating branch deploys needs a
# Premium licence, or a non-Pages host.
#
# The stage is `deploy`, after `validate`: a site whose generator failed its own
# test suite should never reach a URL. It does not run on a tag — a release
# publishes a binary, not a website.
pages:
  extends: .dotnet
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: pages
    url: $CI_PAGES_URL
  script:
    - dotnet run --project src/Okf.Cli -c Release -- site okf/ --out public --name "okf-net"
    - echo "==> published to ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public
