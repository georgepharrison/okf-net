# .releaserc.yml
# Semantic release config for okf-net.
#
# Post-1.0.0 flip (work item #10, 2026-08-16). `main` is a plain release
# branch: merging to it cuts a stable `vX.Y.Z` tag. `dev` carries the `rc`
# prerelease channel, so day-to-day merges ship an installable
# `vX.Y.Z-rc.N` without committing to the number that comes next. Promotion
# is deliberate: `dev` is fast-forwarded into `main` when the release is
# wanted, and that merge is what makes a version stable.
#
# HISTORY — the release-branch requirement, and the two traps that shaped
# this file. semantic-release requires at least one RELEASE-type branch
# (plain name: no range, no prerelease) to exist on the remote, or it fails
# with ERELEASEBRANCHES. Before the flip, `main` was itself a prerelease
# branch, so a placeholder release branch (`stable`) had to exist to satisfy
# the minimum. Two ways to think you have a release branch when you do not,
# both verified empirically on this repo (2026-08-14):
#   1. An unmatched maintenance glob expands to nothing and does not
#      count (semantic-release/semantic-release#2503 — intended behavior).
#   2. A branch named like `1.x` DOES match the glob but is classified as
#      a MAINTENANCE-type branch, which also does not count toward the
#      release-branch minimum. Only a plain-named branch does.
# `main` is now that plain-named branch, so the requirement is satisfied by
# the branch we actually release from and the `stable` placeholder is gone.
# The maintenance glob stays unmatched on purpose: it costs nothing and is
# what a future `1.x` backport line would land on.
branches:
  - "+([0-9])?(.{+([0-9]),x}).x"
  - main
  - name: dev
    prerelease: rc

plugins:
  # Analyze commits to determine version bump
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: docs
          release: patch
        - type: refactor
          release: patch
        - type: perf
          release: patch
        - type: ci
          release: patch

  # Generate release notes from commits.
  #
  # `preset: conventionalcommits` is resolved by NAME at runtime, from
  # whatever `conventional-changelog-conventionalcommits` the release job
  # happens to have installed — nothing here or in semantic-release's own
  # dependency tree constrains that version. The two must match, and when
  # they do not the notes come out as a bare header with no sections (work
  # item #52). The pin that makes this file mean what it says lives in the
  # `release` job in .gitlab-ci.yml; the comment there has the mechanism.
  #
  # `types` REPLACES the preset's defaults rather than extending them, so a
  # type absent from this list is a type absent from the notes — that is how
  # `test`, `build` and `style` stay out, and `chore` is spelled out as
  # hidden only to say so deliberately.
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: "Features"
          - type: fix
            section: "Bug Fixes"
          - type: docs
            section: "Documentation"
          - type: refactor
            section: "Refactoring"
          - type: perf
            section: "Performance"
          - type: ci
            section: "CI/CD"
          - type: chore
            section: "Chores"
            hidden: true

  # Create GitLab release with notes
  - - "@semantic-release/gitlab"
    - gitlabUrl: https://gitlab.tychostation.dev
