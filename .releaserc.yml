# .releaserc.yml
# Semantic release config for okf-net.
#
# Pre-1.0 phase: `main` is configured as a prerelease branch (tag e.g.
# 1.0.0-rc.1) so every merge to main ships an installable prerelease
# without committing to API/format stability yet.
#
# Future flip (tracked in docs/decisions.md): once the toolset reaches a
# stable 1.0, swap `main` to a plain (non-prerelease) release branch and add
# a `dev` branch with `prerelease: true`/`beta` for the pre-release channel.
#
# IMPORTANT — release-branch requirement: semantic-release requires at
# least one RELEASE-type branch (plain name: no range, no prerelease) to
# exist on the remote, or it fails with ERELEASEBRANCHES. Two traps,
# both verified empirically on this repo (2026-08-14):
#   1. An unmatched maintenance glob expands to nothing and does not
#      count (semantic-release/semantic-release#2503 — intended behavior).
#   2. A branch named like `1.x` DOES match the glob but is classified as
#      a MAINTENANCE-type branch, which also does not count toward the
#      release-branch minimum. Only a plain-named branch does.
# Hence `stable` below: a placeholder release-type branch (pushed,
# pointing at main, never built — the release CI job runs on main only).
# On the future flip: make `main` the release branch, add `dev` as the
# prerelease channel, delete `stable`.
branches:
  - "+([0-9])?(.{+([0-9]),x}).x"
  - stable
  - name: main
    prerelease: rc

plugins:
  # Analyze commits to determine version bump
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: docs
          release: patch
        - type: refactor
          release: patch
        - type: perf
          release: patch
        - type: ci
          release: patch

  # Generate release notes from commits
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: "Features"
          - type: fix
            section: "Bug Fixes"
          - type: docs
            section: "Documentation"
          - type: refactor
            section: "Refactoring"
          - type: perf
            section: "Performance"
          - type: ci
            section: "CI/CD"
          - type: chore
            section: "Chores"
            hidden: true

  # Create GitLab release with notes
  - - "@semantic-release/gitlab"
    - gitlabUrl: https://gitlab.tychostation.dev
