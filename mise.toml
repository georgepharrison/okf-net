[tools]
dotnet = "10"
"npm:markdownlint-cli2" = "latest"

[tasks.setup]
description = "Install git hooks"
run = "git config core.hooksPath .githooks"

[tasks.lint]
description = "Lint all markdown files (excluding dot-directories and test fixtures) with markdownlint-cli2"
# Test fixture bundles are deliberately malformed OKF documents — some of them are
# malformed markdown too — so they are lint inputs for `okf lint`, never for
# markdownlint. The same exclusion lives in .githooks/pre-commit.
#
# artifacts/ is generated output (`mise run mutate` writes a markdown mutation report
# there) and is gitignored; markdownlint-cli2 does not read .gitignore, so a build
# product would otherwise decide whether the lint task passes. The pre-commit hook needs
# no equivalent — it only ever sees staged files.
run = 'markdownlint-cli2 "**/*.md" "#**/.*/**" "#tests/**/fixtures/**" "#artifacts/**"'

[tasks.build]
description = "Build the solution"
run = "dotnet build Okf.sln"

[tasks.test]
description = "Run the test suite"
run = "dotnet test Okf.sln"

[tasks.test-install]
description = "Acceptance-test the repo-root install.sh against a fake artifact host (work item #25)"
# Deliberately NOT folded into `mise run test`: that task is `dotnet test`, and this one
# needs python3 and a free TCP port rather than the SDK. Keeping them apart keeps the CI
# jobs apart too — `test` runs on the .NET SDK image, `test-install` on a python image with
# no .NET in it at all, which is the cheaper of the two by a wide margin.
#
# The harness runs install.sh under `sh`, and under `dash` as well when dash is installed
# (it is on Debian, so CI always covers both). A bashism that only bash forgives is the
# class of bug this exists to catch, so the second shell is the point, not a bonus.
run = "tests/install-sh/run.sh"

[tasks.licenses]
description = "Generate a CycloneDX SBOM of the solution and check every dependency license against scripts/licenses-allowed.json (AGENTS.md: dependencies must be Apache-2.0-compatible)"
# The CycloneDX tool is pinned in .config/dotnet-tools.json; the command it
# installs is `dotnet-CycloneDX`, which `dotnet CycloneDX` resolves. Test
# projects are deliberately NOT excluded (no -t/--exclude-test-projects): the
# dependency rule covers test code too, which is where the FluentAssertions-v8
# trap lives. Keep these steps in step with the `licenses` job in .gitlab-ci.yml.
run = [
  "dotnet tool restore",
  "dotnet CycloneDX Okf.sln --output artifacts/sbom --filename bom.json --output-format Json",
  "python3 scripts/check-licenses.py",
]

[tasks.mutate]
description = "Run Stryker.NET mutation testing over the whole solution — the mechanical check behind AGENTS.md's 'tests must be shown to constrain the code'. Reports land in artifacts/stryker/reports."
# Solution mode: Stryker discovers every non-test project in Okf.sln, so Okf.Core and
# Okf.Cli are both mutated in one pass under one score. Everything else lives in
# stryker-config.json; only the output path is passed here, because Stryker has no
# config-file key for it (`output` is CLI-only) and artifacts/ is what .gitignore
# already covers. dotnet-stryker is pinned in .config/dotnet-tools.json.
#
# ~8 minutes on 8 cores for ~3400 mutants. Deliberately not part of `mise run test`.
run = [
  "dotnet tool restore",
  "dotnet stryker --output artifacts/stryker --skip-version-check",
]

[tasks.mutate-quick]
description = "Mutate only what changed against origin/main (Stryker --since). Minutes instead of ~8, at the cost of a score that describes the diff rather than the solution."
# `--since:<committish>` needs the ref to exist locally, so `git fetch origin` first if
# origin/main is stale. Mutants outside the diff are reported with no result, so the
# score printed here is NOT comparable to `mise run mutate`: read it as "did my change
# arrive with tests that kill its mutants", never as the project's score. Written to its
# own output directory so a partial run cannot overwrite a full baseline report.
#
# It only narrows because stryker-config.json's `since.ignore-changes-in` tells Stryker
# which non-C# paths cannot affect a test. Without it, one touched .md or .yml anywhere
# in the tree makes Stryker test every mutant ("Non-CSharp files in test project were
# changed") and the task saves nothing. Test fixtures are deliberately NOT on that list.
run = [
  "dotnet tool restore",
  "dotnet stryker --output artifacts/stryker-since --skip-version-check --since:origin/main",
]

[tasks.cli]
description = 'Run the okf CLI locally, e.g. `mise run cli -- lint ~/code/knowledge-catalog/okf/bundles/ga4`'
run = "dotnet run --project src/Okf.Cli --"

[tasks.bundle]
description = "Package the dogfood bundle for consume-only distribution into artifacts/, and lint the result as a consumer would (work item #5)"
# The same command the tag pipeline's `publish` job runs, minus the pinned
# `--generated-at`: locally the stamp is now, in CI it is the commit's timestamp,
# which is what makes the released archive reproducible from the tag alone.
#
# `--lint` is the gate that matters here: it lints what SHIPPED, with default
# severities and no okf.json, so a promotion in this vault's config cannot make a
# non-conformant distribution look fine. `--verify` re-hashes the archive against
# the manifest it just wrote — cheap, and it proves the attestation is readable by
# the same binary that produced it.
run = [
  "dotnet run --project src/Okf.Cli -- bundle okf/ --out artifacts/okf-net-knowledge.tar.gz --lint",
  "dotnet run --project src/Okf.Cli -- bundle --verify artifacts/okf-net-knowledge.tar.gz",
]

[tasks.publish-aot]
description = "Publish the NativeAOT linux-x64 binary to artifacts/aot, version-stamped from `git describe` (PRD CLI-17)"
# The version is derived by scripts/release-version.sh, which is also what `publish-all`
# calls — one normalization of `git describe`, not two that can drift. Its header explains
# why the derivation lives in a script rather than in MSBuild, and why the distance/sha
# trailer is dropped rather than carried into the version.
#
# This task and `publish-all` hand the SDK exactly what Directory.Build.props documents: a
# bare semver in `-p:Version` and a commit in `-p:SourceRevisionId`. The `publish` CI job
# is the third caller and derives neither — there the tag is the version.
run = """
set -eu

fields="$(scripts/release-version.sh)"
version="${fields%%|*}"
rest="${fields#*|}"
revision="${rest%%|*}"
describe="${rest#*|}"

echo "==> publishing okf ${version}${revision:++$revision} (git describe: ${describe})"
dotnet publish src/Okf.Cli \\
  --configuration Release \\
  --runtime linux-x64 \\
  --output artifacts/aot \\
  -p:Version="$version" \\
  ${revision:+-p:SourceRevisionId="$revision"}

echo "==> artifacts/aot/okf version reports:"
./artifacts/aot/okf version
"""

[tasks.publish-all]
description = "Publish all three release binaries into artifacts/<rid>/ — linux-x64 NativeAOT, osx-arm64 and win-x64 trim-safe self-contained (work item #36)"
# The local rehearsal of what the `publish` CI job uploads. Same three runtime
# identifiers, same publish arguments, same version stamping — so a build that only
# breaks for macOS or Windows breaks here rather than in a tag pipeline.
#
# WHY TWO PUBLISH MODES AND NOT ONE
# ---------------------------------
# NativeAOT compiles to the HOST's native toolchain; `dotnet publish -r osx-arm64
# -p:PublishAot=true` from Linux cannot work, and there is no Mac or Windows runner to
# build on. decisions.md Q10 wrote down the fallback for exactly this case — trim-safe
# self-contained non-AOT, at the cost of size and cold start — and this is the case. So
# linux-x64 stays AOT and the other two are `--self-contained -p:PublishTrimmed=true
# -p:PublishSingleFile=true`, which cross-compiles from anywhere because there is no
# native compile in it: the IL is trimmed, then bundled with a runtime for the target.
#
# `-p:PublishAot=false` is required and not merely tidy: Okf.Cli.csproj sets PublishAot
# for the analyzers, and left on it would try to run ILC for a foreign OS.
#
# The trim analyzer still runs under PublishTrimmed, so the trim-safety Q10 verified for
# AOT is re-verified per RID on every publish, and TreatWarningsAsErrors turns an IL2xxx
# into a failed publish rather than a footnote.
#
# NativeAOT needs a C toolchain and zlib headers on the host (`clang`, `zlib1g-dev` on
# Debian; `clang`, `zlib` on Arch) — that is the linux-x64 leg only. The other two need
# nothing but the SDK.
run = """
set -eu

fields="$(scripts/release-version.sh)"
version="${fields%%|*}"
rest="${fields#*|}"
revision="${rest%%|*}"
describe="${rest#*|}"

echo "==> publishing okf ${version}${revision:++$revision} (git describe: ${describe})"

publish() { # publish <rid> [extra msbuild args...]
  rid="$1"
  shift
  echo "==> ${rid} -> artifacts/${rid}"
  dotnet publish src/Okf.Cli \\
    --configuration Release \\
    --runtime "$rid" \\
    --output "artifacts/${rid}" \\
    -p:Version="$version" \\
    ${revision:+-p:SourceRevisionId="$revision"} \\
    "$@"
}

publish linux-x64
publish osx-arm64 --self-contained -p:PublishAot=false -p:PublishTrimmed=true -p:PublishSingleFile=true
publish win-x64   --self-contained -p:PublishAot=false -p:PublishTrimmed=true -p:PublishSingleFile=true

echo
echo "==> published"
for artifact in artifacts/linux-x64/okf artifacts/osx-arm64/okf artifacts/win-x64/okf.exe; do
  [ -f "$artifact" ] || { echo "    MISSING: $artifact" >&2; exit 1; }
  printf '    %-26s %10s bytes  %s\\n' \\
    "$artifact" \\
    "$(wc -c <"$artifact" | tr -d ' ')" \\
    "$(file -b "$artifact" 2>/dev/null || echo 'install file(1) to see the format')"
done

# Only the linux-x64 binary can be executed here; the other two are cross-compiled and
# their first real run is a tester's. `file` above is the whole static check for them.
echo "==> artifacts/linux-x64/okf version reports:"
./artifacts/linux-x64/okf version
"""

[tasks.trim-check]
description = "Run the per-MR AOT proxy locally: publish linux-x64 trim-safe self-contained with the trim analyzer set to fail on any IL2xxx, then smoke the result (CI job trim-check)"
# The same command the CI job runs. This machine has clang and zlib1g-dev (whatever a
# builder needs for `publish-aot`), so it COULD run a real NativeAOT publish — but this
# task deliberately does not, because the point is to mirror the gate a merge request
# actually gets, not to run the fuller check that is already `mise run publish-aot`.
# `PublishTrimmed` runs the same IL trim analyzer `PublishAot=true` hands to ILC, minus
# the native compile, which is what makes it a fast stand-in the CI runner (no clang, no
# zlib headers) can also run. `-p:TrimmerSingleWarn=false
# -p:SuppressTrimAnalysisWarnings=false -p:TreatWarningsAsErrors=true` is the same trio
# work item #36 wrote down for osx-arm64 and win-x64: expand summaries into individual
# IL2xxx findings and fail the publish on one rather than let it print into a green log.
run = """
set -eu

dotnet publish src/Okf.Cli \\
  --configuration Release \\
  --runtime linux-x64 \\
  --self-contained \\
  -p:PublishAot=false \\
  -p:PublishTrimmed=true \\
  -p:PublishSingleFile=true \\
  -p:TrimmerSingleWarn=false \\
  -p:SuppressTrimAnalysisWarnings=false \\
  -p:TreatWarningsAsErrors=true \\
  --output artifacts/trim-check

echo "==> smoke-testing artifacts/trim-check/okf"
artifacts/trim-check/okf version
artifacts/trim-check/okf help >/dev/null
echo "==> trim-check: zero trim-analysis warnings, okf version and okf help both exit 0"
"""

[tasks.lint-ps1]
description = "Static-analyse install.ps1 with PSScriptAnalyzer (needs pwsh: `mise use -g powershell`). No Windows runner exists, so this is the only mechanical check the PowerShell installer gets."
# install.ps1 is what install.sh is for Linux and macOS — the one file a stranger pipes
# into `iex` — and unlike install.sh it has no acceptance suite, because there is no
# Windows runner in this pipeline and running PowerShell on Linux would not exercise the
# parts that matter (the USER PATH registry entry, `okf.exe`, LOCALAPPDATA). PSScriptAnalyzer
# is a parser and rule engine, not an interpreter, so it runs anywhere pwsh does and it
# catches the class of bug that survives a careful read: an unapproved verb, a cmdlet used
# with a parameter it does not have, an assignment to an automatic variable.
#
# Deliberately NOT in `mise run lint` (which is markdownlint) and not in CI: adding a
# PowerShell provision step to the pipeline for one file is a worse trade than running it
# here. The first REAL run of install.ps1 is on a tester's Windows box either way — see
# README and docs/decisions.md, which both say so out loud.
run = """
set -eu
command -v pwsh >/dev/null 2>&1 || {
  echo "pwsh is not installed — \\`mise use -g powershell\\`, then \\`pwsh -c 'Install-Module PSScriptAnalyzer -Scope CurrentUser'\\`" >&2
  exit 2
}
pwsh -NoProfile -Command '
  $ErrorActionPreference = "Stop"
  if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
    Write-Error "PSScriptAnalyzer is not installed: pwsh -c \"Install-Module PSScriptAnalyzer -Scope CurrentUser\""
  }
  Import-Module PSScriptAnalyzer
  $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning,Information
  if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
  Write-Host "install.ps1: no PSScriptAnalyzer findings"
'
"""

[tasks.check-commit]
description = 'Validate a commit message against Conventional Commits. No args = check HEAD; pass -- -m "<message>" for a literal string, or -- <file> for a file. Shares scripts/check-commit-msg.sh with the commit-msg git hook.'
run = "scripts/check-commit-msg.sh"

[tasks.check-commit-test]
description = "Run scripts/check-commit-msg.test.sh: unit tests for the commit-message guard, including Ringo's 2026-08-16 no-major-bumps rule (docs/decisions.md)."
run = "scripts/check-commit-msg.test.sh"

[tasks.site]
description = 'Generate the static site for the dogfood vault into artifacts/site. Pass -- <args> to override, e.g. `mise run site -- --single-file`.'
# The proof of `okf site` (issue #6), and the way to look at the dashboard while
# iterating on it. artifacts/ is gitignored, so the output is never committed —
# a generated site is a build product, not vault content.
#
# --out deliberately points outside okf/: `okf site` refuses to write into a bundle
# it renders, because the next run would otherwise read its own HTML.
run = 'dotnet run --project src/Okf.Cli -- site okf/ --out artifacts/site --name "okf-net"'
