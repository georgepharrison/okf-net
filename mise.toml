[tools]
dotnet = "10"
"npm:markdownlint-cli2" = "latest"

[tasks.setup]
description = "Install git hooks"
run = "git config core.hooksPath .githooks"

[tasks.lint]
description = "Lint all markdown files (excluding dot-directories and test fixtures) with markdownlint-cli2"
# Test fixture bundles are deliberately malformed OKF documents — some of them are
# malformed markdown too — so they are lint inputs for `okf lint`, never for
# markdownlint. The same exclusion lives in .githooks/pre-commit.
#
# artifacts/ is generated output (`mise run mutate` writes a markdown mutation report
# there) and is gitignored; markdownlint-cli2 does not read .gitignore, so a build
# product would otherwise decide whether the lint task passes. The pre-commit hook needs
# no equivalent — it only ever sees staged files.
run = 'markdownlint-cli2 "**/*.md" "#**/.*/**" "#tests/**/fixtures/**" "#artifacts/**"'

[tasks.build]
description = "Build the solution"
run = "dotnet build Okf.sln"

[tasks.test]
description = "Run the test suite"
run = "dotnet test Okf.sln"

[tasks.test-install]
description = "Acceptance-test the repo-root install.sh against a fake artifact host (work item #25)"
# Deliberately NOT folded into `mise run test`: that task is `dotnet test`, and this one
# needs python3 and a free TCP port rather than the SDK. Keeping them apart keeps the CI
# jobs apart too — `test` runs on the .NET SDK image, `test-install` on a python image with
# no .NET in it at all, which is the cheaper of the two by a wide margin.
#
# The harness runs install.sh under `sh`, and under `dash` as well when dash is installed
# (it is on Debian, so CI always covers both). A bashism that only bash forgives is the
# class of bug this exists to catch, so the second shell is the point, not a bonus.
run = "tests/install-sh/run.sh"

[tasks.licenses]
description = "Generate a CycloneDX SBOM of the solution and check every dependency license against scripts/licenses-allowed.json (AGENTS.md: dependencies must be Apache-2.0-compatible)"
# The CycloneDX tool is pinned in .config/dotnet-tools.json; the command it
# installs is `dotnet-CycloneDX`, which `dotnet CycloneDX` resolves. Test
# projects are deliberately NOT excluded (no -t/--exclude-test-projects): the
# dependency rule covers test code too, which is where the FluentAssertions-v8
# trap lives. Keep these steps in step with the `licenses` job in .gitlab-ci.yml.
run = [
  "dotnet tool restore",
  "dotnet CycloneDX Okf.sln --output artifacts/sbom --filename bom.json --output-format Json",
  "python3 scripts/check-licenses.py",
]

[tasks.mutate]
description = "Run Stryker.NET mutation testing over the whole solution — the mechanical check behind AGENTS.md's 'tests must be shown to constrain the code'. Reports land in artifacts/stryker/reports."
# Solution mode: Stryker discovers every non-test project in Okf.sln, so Okf.Core and
# Okf.Cli are both mutated in one pass under one score. Everything else lives in
# stryker-config.json; only the output path is passed here, because Stryker has no
# config-file key for it (`output` is CLI-only) and artifacts/ is what .gitignore
# already covers. dotnet-stryker is pinned in .config/dotnet-tools.json.
#
# ~8 minutes on 8 cores for ~3400 mutants. Deliberately not part of `mise run test`.
run = [
  "dotnet tool restore",
  "dotnet stryker --output artifacts/stryker --skip-version-check",
]

[tasks.mutate-quick]
description = "Mutate only what changed against origin/main (Stryker --since). Minutes instead of ~8, at the cost of a score that describes the diff rather than the solution."
# `--since:<committish>` needs the ref to exist locally, so `git fetch origin` first if
# origin/main is stale. Mutants outside the diff are reported with no result, so the
# score printed here is NOT comparable to `mise run mutate`: read it as "did my change
# arrive with tests that kill its mutants", never as the project's score. Written to its
# own output directory so a partial run cannot overwrite a full baseline report.
#
# It only narrows because stryker-config.json's `since.ignore-changes-in` tells Stryker
# which non-C# paths cannot affect a test. Without it, one touched .md or .yml anywhere
# in the tree makes Stryker test every mutant ("Non-CSharp files in test project were
# changed") and the task saves nothing. Test fixtures are deliberately NOT on that list.
run = [
  "dotnet tool restore",
  "dotnet stryker --output artifacts/stryker-since --skip-version-check --since:origin/main",
]

[tasks.cli]
description = 'Run the okf CLI locally, e.g. `mise run cli -- lint ~/code/knowledge-catalog/okf/bundles/ga4`'
run = "dotnet run --project src/Okf.Cli --"

[tasks.bundle]
description = "Package the dogfood bundle for consume-only distribution into artifacts/, and lint the result as a consumer would (work item #5)"
# The same command the tag pipeline's `publish` job runs, minus the pinned
# `--generated-at`: locally the stamp is now, in CI it is the commit's timestamp,
# which is what makes the released archive reproducible from the tag alone.
#
# `--lint` is the gate that matters here: it lints what SHIPPED, with default
# severities and no okf.json, so a promotion in this vault's config cannot make a
# non-conformant distribution look fine. `--verify` re-hashes the archive against
# the manifest it just wrote — cheap, and it proves the attestation is readable by
# the same binary that produced it.
run = [
  "dotnet run --project src/Okf.Cli -- bundle okf/ --out artifacts/okf-net-knowledge.tar.gz --lint",
  "dotnet run --project src/Okf.Cli -- bundle --verify artifacts/okf-net-knowledge.tar.gz",
]

[tasks.publish-aot]
description = "Publish the NativeAOT linux-x64 binary to artifacts/aot, version-stamped from `git describe` (PRD CLI-17)"
# Version stamping lives HERE, not in MSBuild: shelling out to git from a build
# would make builds non-deterministic and would fail in a source archive with no
# `.git`. Directory.Build.props documents the SDK-side contract; this task and the
# `publish` CI job are its only two callers, and both hand it a bare semver
# (`-p:Version`) plus a commit (`-p:SourceRevisionId`).
#
# `git describe --tags --always --dirty` is the local source of truth. Its output is
# normalized rather than passed through, because only the first shape below is a
# valid version:
#   v1.0.0-rc.14              exact tag       ->  1.0.0-rc.14
#   v1.0.0-rc.14-3-g1f334c9   3 commits past  ->  1.0.0-rc.14  (+ sha metadata)
#   1f334c9                   no tags at all  ->  0.0.0-dev    (+ sha metadata)
# The distance/sha trailer is DROPPED from the version rather than carried into it;
# the commit it named travels separately as build metadata, taken from
# `git rev-parse --short HEAD`, which is where semver §10 puts a commit. (The
# distance itself is not preserved — the sha is what identifies the build.) Left in
# the version the trailer would be legal semver that sorts ABOVE the tag it followed
# — `1.0.0-rc.14-3-g1f334c9` > `1.0.0-rc.14`, because an alphanumeric prerelease
# identifier outranks a numeric one. That inversion is the trap being avoided.
run = """
set -eu

describe="$(git describe --tags --always --dirty 2>/dev/null || true)"
revision="$(git rev-parse --short HEAD 2>/dev/null || true)"
case "$describe" in
  *-dirty) revision="${revision:-unknown}.dirty" ;;
esac

case "$describe" in
  v[0-9]*)
    version="${describe#v}"
    version="$(printf '%s' "$version" | sed -E 's/(-[0-9]+-g[0-9a-f]+)?(-dirty)?$//')"
    ;;
  *)
    version="0.0.0-dev"
    ;;
esac

echo "==> publishing okf ${version}${revision:++$revision} (git describe: ${describe:-none})"
dotnet publish src/Okf.Cli \\
  --configuration Release \\
  --runtime linux-x64 \\
  --output artifacts/aot \\
  -p:Version="$version" \\
  ${revision:+-p:SourceRevisionId="$revision"}

echo "==> artifacts/aot/okf version reports:"
./artifacts/aot/okf version
"""

[tasks.check-commit]
description = 'Validate a commit message against Conventional Commits. No args = check HEAD; pass -- -m "<message>" for a literal string, or -- <file> for a file. Shares scripts/check-commit-msg.sh with the commit-msg git hook.'
run = "scripts/check-commit-msg.sh"

[tasks.site]
description = 'Generate the static site for the dogfood vault into artifacts/site. Pass -- <args> to override, e.g. `mise run site -- --single-file`.'
# The proof of `okf site` (issue #6), and the way to look at the dashboard while
# iterating on it. artifacts/ is gitignored, so the output is never committed —
# a generated site is a build product, not vault content.
#
# --out deliberately points outside okf/: `okf site` refuses to write into a bundle
# it renders, because the next run would otherwise read its own HTML.
run = 'dotnet run --project src/Okf.Cli -- site okf/ --out artifacts/site --name "okf-net"'
